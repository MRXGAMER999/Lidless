name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Same pinned toolchain as CI (xcode-27 image: macOS 27.0, Xcode 27.0 27A266a).
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  NSUnbufferedIO: "YES"

jobs:
  release:
    name: Build, package and publish
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build, sign ad hoc, package and publish
        # scripts/release.sh archives Release (ad hoc, no hardened runtime, arm64, macOS 12+), checks
        # that the tag matches MARKETING_VERSION, runs scripts/check-availability.sh, writes
        # Lidless-<version>.zip, Lidless-<version>.dmg and SHA256SUMS, then creates the release on
        # this existing tag. Notes come from .github/release-notes/<tag>.md if present, else GitHub's
        # generated notes. Versions with a "-suffix" are marked pre-release.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIDLESS_DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: scripts/release.sh "$GITHUB_REF_NAME" --publish

      - name: Keep the packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lidless-${{ github.ref_name }}
          path: |
            dist/Lidless-*.zip
            dist/Lidless-*.dmg
            dist/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 30
